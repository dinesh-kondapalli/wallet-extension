name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup NodeJS
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Install dependencies and build
        env:
          DEFI_SDK_API_URL: wss://api-v4.bwick.io/
          DEFI_SDK_TESTNET_API_URL: wss://api-testnet.bwick.io/
          BWICK_API_URL: https://zpi.bwick.io/
          BWICK_TESTNET_API_URL: https://zpi-testnet.bwick.io/
          PROXY_URL: https://proxy.bwick.io/
          DEFI_SDK_TRANSACTIONS_API_URL: https://transactions.bwick.io
          DEFI_SDK_API_TOKEN: Bwick.0JOY6zZTTw6yl5Cvz9sdmXc7d5AhzVMG
          TEST_WALLET_ADDRESS: ${{ secrets.TEST_WALLET_ADDRESS }}
          FEATURE_FOOTER_BUG_BUTTON: off
          MIXPANEL_TOKEN_PUBLIC: ${{ secrets.MIXPANEL_TOKEN_PUBLIC_PROD }}
          GOOGLE_ANALYTICS_MEASUREMENT_ID: ${{ secrets.GOOGLE_ANALYTICS_MEASUREMENT_ID }}
          GOOGLE_ANALYTICS_API_SECRET: ${{ secrets.GOOGLE_ANALYTICS_API_SECRET }}
          STATSIG_API_KEY: ${{ secrets.STATSIG_API_KEY }}
          FEATURE_LOYALTY_FLOW: on
          FEATURE_BRIDGE_FORM: on
          FEATURE_SOLANA: on
        run: |
          npm install
          npm run build:production

      - name: Compress build artifacts
        shell: bash
        run: |
          mv dist bwick-wallet-extension-${{github.ref_name}}
          zip -r bwick-wallet-extension-${{github.ref_name}}.zip bwick-wallet-extension-${{github.ref_name}}
          tar czf bwick-wallet-extension-${{github.ref_name}}.tar.gz --directory=bwick-wallet-extension-${{github.ref_name}} .
          mv dist-firefox bwick-wallet-firefox-addon-${{github.ref_name}}
          zip -r bwick-wallet-firefox-addon-${{github.ref_name}}.zip bwick-wallet-firefox-addon-${{github.ref_name}}
          tar czf bwick-wallet-firefox-addon-${{github.ref_name}}.tar.gz --directory=bwick-wallet-firefox-addon-${{github.ref_name}} .

      - name: Create release
        uses: ncipollo/release-action@v1
        with:
          generateReleaseNotes: true
          artifacts: 'bwick-wallet-extension-${{github.ref_name}}.zip,bwick-wallet-extension-${{github.ref_name}}.tar.gz,bwick-wallet-firefox-addon-${{github.ref_name}}.zip,bwick-wallet-firefox-addon-${{github.ref_name}}.tar.gz'

      - name: Notify release
        id: notify-release
        if: ${{ success() }}
        uses: slackapi/slack-github-action@v1.23.0
        with:
          channel-id: 'C04JLLQRB43'
          payload: |
            {
              "text": "New release",
              "icon_emoji": ":gift:",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "<${{ format('{0}/{1}/releases/tag/{2}', github.server_url, github.repository, github.ref_name)}}|${{ github.ref_name }}>"
                  }
                },
                {
                  "type": "context",
                  "elements": [
                    {
                      "type": "mrkdwn",
                      "text": "*Created by:* ${{ github.triggering_actor }}"
                    }
                  ]
                }
              ]
            }
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_AUTH_TOKEN }}
